<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donate - Waseela Umeed</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f5f7f6;
}

/* HEADER */
.header{
  background:#1b8f4c;
  color:white;
  padding:20px;
  text-align:center;
}

/* HERO */
.hero{
  background:url('https://media.istockphoto.com/id/1916612882/photo/portrait-group-and-kids-with-smile-at-school-for-education-learning-and-knowledge-with-hug.jpg?s=612x612&w=0&k=20&c=lqlAbXLT1LX6EUU8f0H5Ip2HSuOKpqoCITrcGHFpwa0=') center/cover;
  height:250px;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  font-size:32px;
  font-weight:bold;
}

/* CONTAINER */
.container{
  max-width:900px;
  margin:auto;
  padding:40px;
  text-align:center;
}

/* AMOUNT BUTTONS */
.amounts{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:15px;
  margin-top:30px;
}

.amounts button{
  width:110px;
  height:110px;
  border-radius:50%;
  border:none;
  background:#1b8f4c;
  color:white;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s ease;
}

.amounts button:hover{
  transform:scale(1.1);
  background:#15733f;
}

/* MODALS */
.modal{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:white;
  padding:20px;
  border-radius:12px;
  width:320px;
  text-align:center;
  position:relative;
  animation:pop 0.3s ease;
}

@keyframes pop{
  from{transform:scale(0.7);}
  to{transform:scale(1);}
}

/* CLOSE */
.close{
  position:absolute;
  top:8px;
  right:12px;
  font-size:20px;
  cursor:pointer;
}

/* INPUTS */
input, select{
  width:90%;
  padding:10px;
  margin:8px 0;
  border-radius:6px;
  border:1px solid #ccc;
}

/* BUTTONS */
.btn{
  padding:10px 15px;
  border:none;
  margin:8px;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}

.green{
  background:#1b8f4c;
  color:white;
}

.gray{
  background:#ccc;
}

/* THANK YOU */
.thankyou{
  display:none;
}
</style>
</head>

<body>

<div class="header">
  <h1>Donate to Waseela Umeed (PKR)</h1>
</div>

<div class="hero">
  Make a Difference Today
</div>

<div class="container">

  <h2>Select Donation Amount</h2>

  <div class="amounts">
    <button onclick="openInfo(5000)">PKR 5,000</button>
    <button onclick="openInfo(10000)">PKR 10,000</button>
    <button onclick="openInfo(25000)">PKR 25,000</button>
    <button onclick="openInfo(50000)">PKR 50,000</button>
    <button onclick="openInfo(100000)">PKR 100,000</button>
  </div>

</div>

<!-- STEP 1: INFO MODAL -->
<div class="modal" id="infoModal">
  <div class="modal-content">
    <span class="close" onclick="closeAll()">×</span>

    <h3>Donor Information</h3>

    <input type="text" id="phone" placeholder="Contact Number">
    <input type="text" id="account" placeholder="Account Number">

    <select id="method">
      <option value="">Select Payment Method</option>
      <option value="EasyPaisa">EasyPaisa</option>
      <option value="Bank">Bank Account</option>
    </select>

    <button class="btn green" onclick="goConfirm()">Continue</button>
    <button class="btn gray" onclick="closeAll()">Cancel</button>
  </div>
</div>

<!-- STEP 2: CONFIRM -->
<div class="modal" id="confirmModal">
  <div class="modal-content">
    <span class="close" onclick="closeAll()">×</span>

    <h3>Are you sure?</h3>
    <p id="amountText"></p>

    <button class="btn gray" onclick="closeAll()">Not Sure</button>
    <button class="btn green" onclick="donate()">Donate</button>
  </div>
</div>

<!-- THANK YOU -->
<div class="modal thankyou" id="thankyou">
  <div class="modal-content">
    <span class="close" onclick="closeAll()">×</span>

    <h2>Thank You ❤️</h2>
    <p>Thank you for choosing our organization.<br>Your support matters.</p>
  </div>
</div>

<script>

let selectedAmount = 0;

function openInfo(amount){
  selectedAmount = amount;
  document.getElementById("infoModal").style.display = "flex";
}

function goConfirm(){

  let phone = document.getElementById("phone").value;
  let account = document.getElementById("account").value;
  let method = document.getElementById("method").value;

  if(phone === "" || account === "" || method === ""){
    alert("Please fill all fields");
    return;
  }

  document.getElementById("infoModal").style.display = "none";
  document.getElementById("amountText").innerText =
    "You selected PKR " + selectedAmount + 
    "\nMethod: " + method;

  document.getElementById("confirmModal").style.display = "flex";
}

function donate(){
  document.getElementById("confirmModal").style.display = "none";
  document.getElementById("thankyou").style.display = "flex";
}

function closeAll(){
  document.getElementById("infoModal").style.display = "none";
  document.getElementById("confirmModal").style.display = "none";
  document.getElementById("thankyou").style.display = "none";
}

</script>

</body>
</html>
