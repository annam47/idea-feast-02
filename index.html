<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waseela Umeed - Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    height: 100vh;
    background: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRF2rQcrewfPlWJAE0YSOksVVLKRvNEXuXZOQ&s') no-repeat center/cover;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.overlay {
    position: absolute;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.45);
}

.login-box { 
    position: relative;
    background: rgba(255,255,255,0.22);
    backdrop-filter: blur(15px);
    padding: 35px;
    border-radius: 22px;
    width: 360px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.35);
    text-align: center;
    z-index: 2;
    border: 1px solid rgba(255,255,255,0.2);
}

h2 {
    margin-bottom: 6px;
    color: #1b8f4c;
    font-size: 28px;
}

.subtitle {
    margin-bottom: 20px;
    font-size: 14px;
    color: #f1f1f1;
}

.input-box{
    position: relative;
    margin-bottom: 15px;
}

.input-box input {
    width: 100%;
    padding: 13px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.3);
    outline: none;
    font-size: 14px;
    background: rgba(255,255,255,0.9);
    transition: 0.3s;
}

.input-box input:focus {
    border-color: #27ae60;
    box-shadow: 0 0 8px rgba(39,174,96,0.3);
}

/* FORGOT PASSWORD */
.forgot-password{
    text-align: right;
    margin-top: -5px;
    margin-bottom: 15px;
}

.forgot-password a{
    text-decoration: none;
    color: #ffffff;
    font-size: 13px;
    transition: 0.3s;
}

.forgot-password a:hover{
    color: #27ae60;
}

/* SECURITY MESSAGE */
.security-box{
    background: rgba(39,174,96,0.15);
    border: 1px solid rgba(39,174,96,0.3);
    padding: 10px;
    border-radius: 10px;
    color: white;
    font-size: 12px;
    margin-bottom: 15px;
    text-align: left;
}

.btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    margin-top: 10px;
    cursor: pointer;
    font-weight: bold;
    font-size: 15px;
    transition: 0.3s;
}

.login-btn {
    background: #27ae60;
    color: white;
}

.signup-btn {
    background: #3498db;
    color: white;
}

.btn:hover {
    transform: translateY(-2px);
    opacity: 0.95;
}

/* SMALL TEXT */
.bottom-text{
    margin-top: 15px;
    color: white;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="overlay"></div>

<div class="login-box">

    <h2>🌿 Waseela Umeed</h2>
    <p class="subtitle">Give hope through your donation</p>

    <!-- USERNAME -->
    <div class="input-box">
        <input type="text" id="username" placeholder="Enter Username" autocomplete="off">
    </div>

    <!-- EMAIL INPUT -->
    <div class="input-box">
        <input type="email" id="email" placeholder="Enter Email Address" autocomplete="off">
    </div>

    <!-- PASSWORD -->
    <div class="input-box">
        <input type="password" id="password" placeholder="Enter Password">
    </div>

    <!-- FORGOT PASSWORD -->
    <div class="forgot-password">
        <a href="#" onclick="forgotPassword()">Forgot Password?</a>
    </div>

    <!-- SECURITY -->
    <div class="security-box">
        🔒 Your information is protected with secure login validation.
    </div>

    <!-- BUTTONS -->
    <button class="btn login-btn" onclick="login()">Login</button>
    <button class="btn signup-btn" onclick="signup()">Sign Up</button>

    <div class="bottom-text">
        Secure Donation Platform • Waseela Umeed
    </div>

</div>

<script>

// EMAIL VALIDATION
function validateEmail(email) {
    let pattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
    return pattern.test(email);
}

// LOGIN FUNCTION
function login() {

    let user = document.getElementById('username').value.trim();
    let email = document.getElementById('email').value.trim();
    let pass = document.getElementById('password').value.trim();

    // VALIDATION
    if(user === "" || email === "" || pass === ""){
        alert("Please fill all fields");
        return;
    }

    // EMAIL CHECK
    if(!validateEmail(email)){
        alert("Please enter a valid email address");
        return;
    }

    // PASSWORD SECURITY
    if(pass.length < 6){
        alert("Password must be at least 6 characters");
        return;
    }

    // SAVE DATA SECURELY
    localStorage.setItem("user", user);
    localStorage.setItem("email", email);

    // SUCCESS
    alert("Welcome " + user + "! Login Successful 🔐");

    // REDIRECT
    window.location.href = "home.html";
}

// SIGNUP
function signup(){
    alert("Sign Up feature coming soon 🚧");
}

// FORGOT PASSWORD
function forgotPassword(){
    let email = prompt("Enter your registered email:");

    if(email === null || email.trim() === ""){
        alert("Email is required");
        return;
    }

    if(!validateEmail(email)){
        alert("Please enter a valid email");
        return;
    }

    alert("Password reset link sent to " + email);
}

</script>

</body>
</html>
